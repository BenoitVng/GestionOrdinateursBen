# Configuration nginx pour servir l'application Blazor WebAssembly
server {
    # Le front écoute sur le port 5000 (consigne du TP)
    listen 5000;
    server_name localhost;

    # Dossier où le Dockerfile copie les fichiers publiés (wwwroot)
    root /usr/share/nginx/html;
    index index.html;

    # Renvoie index.html pour les routes Blazor (ex: /ordinateurs) au lieu d'une 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
